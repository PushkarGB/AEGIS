[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ai"
version = "0.0.1"
description = "SIH 2026 Sovereign On-Premise Agentic AI Workbench prototype"
readme = "Docs/README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
