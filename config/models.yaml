providers:
  - id: local_ollama
    kind: ollama
    enabled: true
    endpoint: http://localhost:11434/v1
    timeout_seconds: 60
  - id: temporary_api_stub
    kind: api
    enabled: false
    endpoint: https://example.invalid/v1
    timeout_seconds: 60

models:
  - id: agent_model
    name: "Qwen3 8B Agent"
    provider: local_ollama
    provider_model_id: qwen3:8b
    roles:
      - agent
    capabilities:
      - text_generation
      - reasoning
      - planning
      - drafting
    modalities:
      - text
    task_types:
      - general_reasoning
      - drafting
    enabled: true
    context_window: 8192
    parameters: "8B"
    quantization: null
    available: true
    health: unknown
  - id: coding_model
    name: "Qwen2.5 Coder 7B"
    provider: local_ollama
    provider_model_id: qwen2.5-coder:7b
    roles:
      - coding
    capabilities:
      - text_generation
      - code_generation
    modalities:
      - text
    task_types:
      - code_generation
    enabled: true
    context_window: 8192
    parameters: null
    quantization: null
    available: true
    health: unknown
  - id: vision_model
    name: "Qwen3.5 Vision"
    provider: local_ollama
    provider_model_id: qwen3.5:latest
    roles:
      - vision
    capabilities:
      - text_generation
      - image_understanding
    modalities:
      - text
      - image
    task_types:
      - visual_reasoning
      - image_analysis
    enabled: true
    context_window: 8192
    parameters: null
    quantization: null
    available: true
    health: unknown

role_defaults:
  agent: agent_model
  coding: coding_model
  vision: vision_model
